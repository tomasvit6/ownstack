name: upstream drift check

# Opens (or updates) an issue when upstream pstack moves ahead of this port.
# Advisory only: it never edits the tree or fails a build.

on:
  schedule:
    - cron: "0 9 * * 1"        # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream pstack
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/cursor/plugins.git /tmp/upstream
          cd /tmp/upstream && git sparse-checkout set pstack

      - name: Diff against the port
        id: diff
        run: |
          python3 scripts/port.py --upstream /tmp/upstream/pstack --check \
            > /tmp/report.txt 2>&1 || true
          cat /tmp/report.txt
          if grep -q "up to date with upstream." /tmp/report.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'report<<REPORT_EOF'
            cat /tmp/report.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.diff.outputs.drift == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.diff.outputs.report }}
        with:
          script: |
            const title = 'Upstream pstack has moved';
            const body = [
              'Upstream [pstack](https://github.com/cursor/plugins/tree/main/pstack)',
              'has changes this port does not carry yet.',
              '',
              '```',
              process.env.REPORT.trim(),
              '```',
              '',
              'To apply, see [SYNCING.md](../blob/main/SYNCING.md):',
              '',
              '```bash',
              'python3 scripts/port.py --upstream <path-to-pstack>',
              '```',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
            });

            if (open.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift'],
              });
            }
